<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Muistipeli</title>

    <link rel="stylesheet" href="styles.css">

    <script type="module" src="game.js"></script>
</head>

<body>

    <header>
        <h1>Muistipeli</h1>
        <p>Etsi kaikki parit mahdollisimman nopeasti!</p>
    </header>

    <main>

        <section class="game-info">

            <div>
                <h3>Pisteet</h3>
                <p id="score">0</p>
            </div>

            <div>
                <h3>Aika</h3>
                <p id="timer">00:00</p>
            </div>

        </section>

        <section class="game-container">

            <h2>Pelilauta</h2>

            <div id="game-board" class="game-board">
            </div>
            <button id="new-game">Uusi peli</button>
        </section>

    </main>

    <footer>
        <p>Muistipeli</p>
    </footer>

</body>

</html>
